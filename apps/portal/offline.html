<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090C" />
    <title>Jsi offline — VeVit Games</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 20px;
        padding: 24px;
        background: #08090c;
        color: #ffffff;
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        font-size: 1.5rem;
        letter-spacing: -0.01em;
        margin: 0;
      }
      #stav {
        color: #a1a1aa;
        font-size: 1rem;
        margin: 0;
      }
      #stav.je-online { color: #10b981; }
      #hra {
        width: min(640px, 100%);
        aspect-ratio: 640 / 240;
        border: 1px solid #272a30;
        border-radius: 12px;
        overflow: hidden;
        touch-action: none;
      }
      a {
        color: #10b981;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <h1>Zatím jsi offline</h1>
    <p id="stav">Jsi offline. Než se připojíš, zkus Běžce.</p>
    <div id="hra"></div>
    <a href="/cs/">Zkusit znovu načíst portál</a>
    <script type="module" src="/offline/main.ts"></script>
  </body>
</html>
