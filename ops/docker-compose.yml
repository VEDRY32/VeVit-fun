# VeVit Games — produkční stack na VPS (Ubuntu 24.04 LTS)
# Žádný kontejner nepublikuje port mimo caddy.
name: vevit-games

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - web_dist:/srv/web:ro
    depends_on:
      - api
      - realtime
    networks: [edge, internal]
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    image: ${REGISTRY}/vevit-games-web:${TAG:-latest}
    restart: "no"
    command: ["sh", "-c", "rm -rf /out/* && cp -r /app/dist/. /out/"]
    volumes:
      - web_dist:/out
    networks: [internal]
    logging: *logging

  api:
    image: ${REGISTRY}/vevit-games-api:${TAG:-latest}
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: production
      PORT: "3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]
    logging: *logging

  realtime:
    image: ${REGISTRY}/vevit-games-realtime:${TAG:-latest}
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: production
      PORT: "3002"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]
    logging: *logging

  worker:
    image: ${REGISTRY}/vevit-games-worker:${TAG:-latest}
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: production
      TZ: Europe/Prague
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  web_dist:

networks:
  edge:
  internal:
    internal: true
